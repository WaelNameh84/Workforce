<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>WorkforceOS</title>
    <meta name="description" content="منصة إدارة الموارد البشرية" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WorkforceOS" />
    <!-- Apple: PNG icons required (SVG not supported by iOS Safari) -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <!-- Apple splash screens (prevents browser chrome on launch) -->
    <meta name="apple-touch-fullscreen" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;background:#0f172a;">
    <div id="root" style="min-height:100vh;background:#0f172a;">
      <!-- pre-splash shown while JS loads -->
      <div id="pre-splash" style="
        position:fixed;inset:0;z-index:9999;
        background:#0f172a;
        display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:16px;
      ">
        <div style="
          width:72px;height:72px;border-radius:20px;
          background:linear-gradient(135deg,#6366f1,#8b5cf6);
          display:flex;align-items:center;justify-content:center;
          font-size:32px;font-weight:700;color:white;font-family:system-ui,sans-serif;
          box-shadow:0 0 40px rgba(99,102,241,0.5);
        ">W</div>
        <div style="color:white;font-family:system-ui,sans-serif;font-size:18px;font-weight:700;letter-spacing:.04em;">WorkforceOS</div>
        <div style="
          width:160px;height:3px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:8px;
        ">
          <div style="
            height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:99px;
            animation:w-load 1.8s ease-in-out infinite;
          "></div>
        </div>
        <style>
          @keyframes w-load {
            0%   { width:0%;   margin-left:0;   }
            50%  { width:80%;  margin-left:10%; }
            100% { width:0%;   margin-left:100%;}
          }
        </style>
      </div>
    </div>
    <script>
      // Remove pre-splash once React takes over
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          var pre  = document.getElementById('pre-splash');
          if (root && pre && root.children.length > 1) {
            pre.style.opacity = '0';
            pre.style.transition = 'opacity 0.4s';
            setTimeout(function(){ pre.remove(); }, 400);
            observer.disconnect();
          }
        });
        var root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true, subtree: false });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
