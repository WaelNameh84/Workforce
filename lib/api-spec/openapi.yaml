openapi: 3.0.0
info:
  title: API
  version: 1.0.0
  description: WorkforceOS - Multilingual Workforce Management Platform API

servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, fullName, company]
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        company:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
        companyId:
          type: integer
        employeeId:
          type: integer
          nullable: true

    # Dashboard
    DashboardStats:
      type: object
      properties:
        totalEmployees:
          type: integer
        presentToday:
          type: integer
        onLeave:
          type: integer
        pendingRequests:
          type: integer
        monthlyPayroll:
          type: number
        recentAttendance:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              present:
                type: integer
              absent:
                type: integer
        departmentStats:
          type: array
          items:
            type: object
            properties:
              department:
                type: string
              count:
                type: integer

    # Employee
    Employee:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        departmentId:
          type: integer
          nullable: true
        departmentName:
          type: string
          nullable: true
        employeeCode:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        salary:
          type: string
          nullable: true
        joinDate:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        contractType:
          type: string
          nullable: true
        managerName:
          type: string
          nullable: true
        workStart:
          type: string
          nullable: true
        workEnd:
          type: string
          nullable: true
        workDays:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive, on-leave]
        avatar:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    EmployeeInput:
      type: object
      required: [fullName, email]
      properties:
        employeeCode:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        position:
          type: string
        salary:
          type: string
        joinDate:
          type: string
        gender:
          type: string
        contractType:
          type: string
        managerName:
          type: string
        workStart:
          type: string
        workEnd:
          type: string
        workDays:
          type: string
        departmentId:
          type: integer
        status:
          type: string
          enum: [active, inactive, on-leave]
        address:
          type: string
        notes:
          type: string

    # Department
    Department:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [name, companyId]
      properties:
        name:
          type: string
        companyId:
          type: integer
        description:
          type: string

    # Attendance
    Attendance:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
          nullable: true
        date:
          type: string
        clockIn:
          type: string
          nullable: true
        clockOut:
          type: string
          nullable: true
        totalHours:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        method:
          type: string
          nullable: true
        gpsLatitude:
          type: number
          nullable: true
        gpsLongitude:
          type: number
          nullable: true
        gpsAccuracy:
          type: number
          nullable: true
        status:
          type: string
          enum: [present, absent, late, half-day]
        isLate:
          type: boolean
        notes:
          type: string
          nullable: true
        justificationType:
          type: string
          nullable: true
          enum: [late, early, overtime, other]
        justificationStatus:
          type: string
          enum: [none, pending, approved, rejected]
        paymentStatus:
          type: string
          enum: [pending, paid, unpaid]
        justificationApprovedBy:
          type: integer
          nullable: true
        justificationApprovedAt:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ClockInInput:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: integer
        location:
          type: string
        method:
          type: string
        gpsLatitude:
          type: number
          nullable: true
        gpsLongitude:
          type: number
          nullable: true
        gpsAccuracy:
          type: number
          nullable: true

    ClockOutInput:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: integer

    AttendanceUpdateInput:
      type: object
      properties:
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [present, absent, late, half-day]
          nullable: true
        justificationType:
          type: string
          enum: [late, early, overtime, other]
        justificationStatus:
          type: string
          enum: [none, pending, approved, rejected]
        paymentStatus:
          type: string
          enum: [pending, paid, unpaid]

    # Leave
    Leave:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
          nullable: true
        type:
          type: string
          enum: [annual, sick, emergency, maternity, paternity, unpaid]
        startDate:
          type: string
        endDate:
          type: string
        daysCount:
          type: integer
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        paymentStatus:
          type: string
          enum: [pending, paid, unpaid]
        approvedBy:
          type: integer
          nullable: true
        approvedAt:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LeaveInput:
      type: object
      required: [employeeId, type, startDate, endDate, daysCount]
      properties:
        employeeId:
          type: integer
        type:
          type: string
          enum: [annual, sick, emergency, maternity, paternity, unpaid]
        startDate:
          type: string
        endDate:
          type: string
        daysCount:
          type: integer
        reason:
          type: string

    LeaveUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        paymentStatus:
          type: string
          enum: [pending, paid, unpaid]
        approvedBy:
          type: integer

    # Schedule
    Schedule:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
          nullable: true
        date:
          type: string
        shiftType:
          type: string
          enum: [morning, evening, night, off]
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        isRemote:
          type: boolean
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ScheduleInput:
      type: object
      required: [employeeId, date, shiftType]
      properties:
        employeeId:
          type: integer
        date:
          type: string
        shiftType:
          type: string
          enum: [morning, evening, night, off]
        startTime:
          type: string
        endTime:
          type: string
        isRemote:
          type: boolean
        notes:
          type: string

    # Payroll
    Payroll:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
          nullable: true
        departmentName:
          type: string
          nullable: true
        period:
          type: string
        contractType:
          type: string
          nullable: true
          enum: [monthly, daily, hourly]
        workDaysPerMonth:
          type: integer
          nullable: true
        dailyHoursScheduled:
          type: string
          nullable: true
        basicSalary:
          type: string
        dailyRate:
          type: string
          nullable: true
        hourlyRate:
          type: string
          nullable: true
        minuteRate:
          type: string
          nullable: true
        secondRate:
          type: string
          nullable: true
        workedDays:
          type: string
          nullable: true
        workedHours:
          type: string
          nullable: true
        workedMinutes:
          type: string
          nullable: true
        workedSeconds:
          type: string
          nullable: true
        absentDays:
          type: string
          nullable: true
        lateMinutes:
          type: string
          nullable: true
        earlyMinutes:
          type: string
          nullable: true
        overtimeHours:
          type: string
          nullable: true
        overtimeRate:
          type: string
          nullable: true
        overtime:
          type: string
        bonus:
          type: string
        allowances:
          type: string
          nullable: true
        commissions:
          type: string
          nullable: true
        grossSalary:
          type: string
          nullable: true
        lateDeduction:
          type: string
          nullable: true
        absenceDeduction:
          type: string
          nullable: true
        advances:
          type: string
          nullable: true
        fines:
          type: string
          nullable: true
        deductions:
          type: string
        tax:
          type: string
        insurance:
          type: string
          nullable: true
        totalEarnings:
          type: string
          nullable: true
        totalDeductions:
          type: string
          nullable: true
        netSalary:
          type: string
        paidLeaveDays:
          type: string
          nullable: true
        unpaidLeaveDays:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, pending, approved, paid, locked]
        approvedBy:
          type: integer
          nullable: true
        approvedAt:
          type: string
          nullable: true
        lockedAt:
          type: string
          nullable: true
        paidAt:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PayrollInput:
      type: object
      required: [employeeId, period, basicSalary]
      properties:
        employeeId:
          type: integer
        period:
          type: string
        contractType:
          type: string
          enum: [monthly, daily, hourly]
        workDaysPerMonth:
          type: integer
        dailyHoursScheduled:
          type: string
        basicSalary:
          type: string
        dailyRate:
          type: string
        hourlyRate:
          type: string
        workedDays:
          type: string
        workedHours:
          type: string
        workedMinutes:
          type: string
        workedSeconds:
          type: string
        absentDays:
          type: string
        lateMinutes:
          type: string
        earlyMinutes:
          type: string
        overtimeHours:
          type: string
        overtimeRate:
          type: string
        overtime:
          type: string
        bonus:
          type: string
        allowances:
          type: string
        commissions:
          type: string
        grossSalary:
          type: string
        lateDeduction:
          type: string
        absenceDeduction:
          type: string
        advances:
          type: string
        fines:
          type: string
        deductions:
          type: string
        tax:
          type: string
        insurance:
          type: string
        totalEarnings:
          type: string
        totalDeductions:
          type: string
        netSalary:
          type: string
        paidLeaveDays:
          type: string
        unpaidLeaveDays:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [draft, pending, approved, paid, locked]

    PayrollUpdate:
      type: object
      properties:
        contractType:
          type: string
          enum: [monthly, daily, hourly]
        workDaysPerMonth:
          type: integer
        basicSalary:
          type: string
        overtime:
          type: string
        overtimeHours:
          type: string
        overtimeRate:
          type: string
        bonus:
          type: string
        allowances:
          type: string
        commissions:
          type: string
        advances:
          type: string
        fines:
          type: string
        deductions:
          type: string
        tax:
          type: string
        insurance:
          type: string
        netSalary:
          type: string
        grossSalary:
          type: string
        totalEarnings:
          type: string
        totalDeductions:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [draft, pending, approved, paid, locked]

    PayrollApprove:
      type: object
      properties:
        approvedBy:
          type: integer

    # WorkRequest
    WorkRequest:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
          nullable: true
        type:
          type: string
          enum: [leave, overtime, shift_change, expense, equipment]
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        paymentStatus:
          type: string
          enum: [pending, paid, unpaid]
        approvedBy:
          type: integer
          nullable: true
        approvedAt:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WorkRequestInput:
      type: object
      required: [employeeId, type, title]
      properties:
        employeeId:
          type: integer
        type:
          type: string
          enum: [leave, overtime, shift_change, expense, equipment]
        title:
          type: string
        description:
          type: string

    WorkRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        paymentStatus:
          type: string
          enum: [pending, paid, unpaid]
        approvedBy:
          type: integer

    # Asset
    Asset:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        type:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        assignedTo:
          type: integer
          nullable: true
        assignedToName:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, assigned, maintenance, retired]
        purchaseDate:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AssetInput:
      type: object
      required: [companyId, name]
      properties:
        companyId:
          type: integer
        name:
          type: string
        type:
          type: string
        serialNumber:
          type: string
        assignedTo:
          type: integer
        status:
          type: string
          enum: [available, assigned, maintenance, retired]
        purchaseDate:
          type: string

    AssetUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        serialNumber:
          type: string
        assignedTo:
          type: integer
        status:
          type: string
          enum: [available, assigned, maintenance, retired]
        purchaseDate:
          type: string

    # Error
    Error:
      type: object
      properties:
        error:
          type: string

    # List responses
    EmployeeList:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        total:
          type: integer

    AttendanceList:
      type: object
      properties:
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
        total:
          type: integer

    LeaveList:
      type: object
      properties:
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/Leave'
        total:
          type: integer

    ScheduleList:
      type: object
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'

    PayrollList:
      type: object
      properties:
        payroll:
          type: array
          items:
            $ref: '#/components/schemas/Payroll'
        total:
          type: integer

    PayrollStats:
      type: object
      properties:
        period:
          type: string
        totalBasicSalary:
          type: number
        totalGross:
          type: number
        totalNet:
          type: number
        totalOvertime:
          type: number
        totalBonus:
          type: number
        totalAllowances:
          type: number
        totalDeductions:
          type: number
        totalTax:
          type: number
        totalInsurance:
          type: number
        averageSalary:
          type: number
        maxSalary:
          type: number
        minSalary:
          type: number
        headcount:
          type: integer
        approvedCount:
          type: integer
        pendingCount:
          type: integer
        paidCount:
          type: integer
        totalWorkedHours:
          type: number
        totalOvertimeHours:
          type: number

    WorkRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/WorkRequest'
        total:
          type: integer

    AssetList:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'

    DepartmentList:
      type: object
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    # WorkDoc
    WorkDoc:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
          nullable: true
        departmentId:
          type: integer
          nullable: true
        departmentName:
          type: string
          nullable: true
        attendanceId:
          type: integer
          nullable: true
        photoData:
          type: string
        photoName:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        uploadedBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    WorkDocInput:
      type: object
      required: [companyId, employeeId, photoData]
      properties:
        companyId:
          type: integer
        employeeId:
          type: integer
        attendanceId:
          type: integer
        photoData:
          type: string
        photoName:
          type: string
        caption:
          type: string

    WorkDocList:
      type: object
      properties:
        docs:
          type: array
          items:
            $ref: '#/components/schemas/WorkDoc'
        total:
          type: integer

    # Location
    Location:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LocationInput:
      type: object
      required: [name, companyId]
      properties:
        name:
          type: string
        companyId:
          type: integer
        address:
          type: string
        city:
          type: string
        country:
          type: string

    LocationList:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # Auth
  /auth/login:
    post:
      operationId: login
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      operationId: register
      summary: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      summary: Get dashboard statistics
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  # Employees
  /employees:
    get:
      operationId: getEmployees
      summary: List employees
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
    post:
      operationId: createEmployee
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{id}:
    get:
      operationId: getEmployee
      summary: Get employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
    put:
      operationId: updateEmployee
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
    delete:
      operationId: deleteEmployee
      summary: Delete employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No content

  # Departments
  /departments:
    get:
      operationId: getDepartments
